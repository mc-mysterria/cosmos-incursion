# ~ Cosmos Incursion Configuration ~

event:
  # Enable automatic event start when conditions are met
  auto-start: false

  # Minimum players online to trigger event
  min-players: 30

  # Cooldown between events (in minutes)
  cooldown-minutes: 120

  # Event duration (in minutes)
  duration-minutes: 30

  # Countdown before event starts (in seconds)
  countdown-seconds: 60

zones:
  # Number of zones to create
  base-count: 1

  # Additional zone per X players (e.g., 2 zones at 30, 3 zones at 50)
  players-per-zone: 20

  # Maximum zones regardless of player count
  max-count: 5

  # Zone radius in blocks
  radius: 150

  # Minimum distance from town claims (in blocks)
  town-buffer: 50

  # Minimum distance between zone centers
  min-separation: 500

  # How many zones of each tier to spawn per event.
  # Zones are assigned in order: green first, death last.
  # If more zones are generated than the sum here, extras default to GREEN.
  tier-distribution:
    green: 1
    yellow: 1
    red: 1
    death: 1

  # Per-tier rules. drop-chance is 0.0 (keep all) to 1.0 (drop all).
  # reward-command runs as console on kill; use %player% for the killer's name.
  # particle-color is a 6-digit hex RGB string (no '#'). Leave blank for defaults.
  # pvp-acting-effort is CircleOfImagination effort granted to the killer via the
  # PLAYER_INTERACTION source for a qualifying PvP kill in a zone of this tier
  # (blocked for griefing kills / Corrupted Monster killers, see balancing.anti-grief).
  # 0.5 = small effort, 1.0 = normal effort, 2.0 = large effort.
  tiers:
    green:
      drop-chance: 0.0
      reward-command: ""
      particle-color: "00DC00"
      pvp-acting-effort: 0.5
    yellow:
      drop-chance: 0.33
      reward-command: ""
      particle-color: "FFDC00"
      pvp-acting-effort: 1.0
    red:
      drop-chance: 1.0
      reward-command: ""
      particle-color: "FF3C3C"
      pvp-acting-effort: 1.5
    death:
      drop-chance: 1.0
      reward-command: ""
      particle-color: "500000"
      pvp-acting-effort: 2.5

  # Zone boundary particles
  boundary-particles-enabled: true
  boundary-particle-update-ticks: 40  # How often to spawn particles (40 ticks = 2 seconds)
  boundary-particle-view-distance: 50.0  # How close players need to be to see particles

balancing:
  spirit-weight:
    # Sequences affected by Spirit Weight (high-tier penalties)
    min-sequence: 4
    max-sequence: 5

    # DOT damage per tick
    dot-damage: 1.0

    # Ticks between DOT damage (100 ticks = 5 seconds)
    dot-interval-ticks: 100

  anti-grief:
    # Number of low-tier kills before marked as Corrupted Monster
    kill-threshold: 3

    # Time window for kill tracking (in seconds)
    time-window-seconds: 600

    # Sequence difference to count as "griefing"
    sequence-difference: 3

    # Duration of Corrupted Monster status (in minutes)
    corrupted-duration-minutes: 15

  acting-rewards:
    # Exponential backoff for repeat kills: each additional kill of the same victim
    # within the reset window multiplies the acting reward by this factor.
    # Prevents duo/alt farming of repeat kills while still rewarding some effort.
    pvp-repeat-kill-decay-factor: 0.5

    # Seconds since the last kill of a specific victim after which the repeat-kill
    # counter resets and the killer earns full reward again.
    pvp-repeat-kill-reset-seconds: 1800

    # Floor multiplier repeat kills can decay to (prevents the reward from ever
    # reaching exactly zero while still making excessive farming nearly worthless).
    pvp-repeat-kill-min-multiplier: 0.05

death:
  # Sequence that triggers regression penalty
  regression-sequence: 6

  # Percentage of acting restored after sequence regression (0.0 - 1.0)
  # When player doesn't have enough acting to lose, they regress and get this % back
  # Example: 0.8 = receive 80% of new sequence's needed acting
  regression-acting-restored: 0.99

  # Percentage of acting lost as penalty (0.0 - 1.0)
  # If player has this % of needed acting: just lose it (no regression, no char drop)
  # If player has less: full sequence regression (with acting restored, drops char)
  # Example: 0.5 = need 50% of needed acting to avoid regression
  regression-acting-penalty: 0.5

  # Cooldown between death penalties (in seconds)
  # Prevents players from regressing multiple times in quick succession
  # Example: 60 = 1 minute cooldown between death penalties
  death-penalty-cooldown-seconds: 20

  # Command to grant Cosmos Crate (placeholder: %player%)
  crate-command: "emp admin crate give %player% pvp 1"

combat-log:
  # How long Hollow Body NPC persists (in minutes)
  npc-duration-minutes: 5

  # NPC name format (placeholder: %player%)
  npc-name-format: "Hollow %player%"

beacons:
  # Capture radius around beacon
  capture-radius: 20

  # Points needed to fully capture
  capture-points: 100

  # Points per player per second
  points-per-player: 1

  # Decay rate when uncontested (points per second)
  decay-rate: 0.5

  # CircleOfImagination effort granted (via WORLD_CONTENT source) to each player
  # present when their town fully captures the beacon.
  capture-acting-effort: 2.0

rewards:
  # Legacy/default Acting Speed delta (0.10 = +10% acting speed). Kept as the fallback used when
  # loading a buff_data.json written before the per-rank podium rework below, and as the default
  # for rank 1 if "podium" doesn't define one. This is a DELTA, not a multiplier — CoiToolkit
  # adds it on top of 1.0, so 0.10 really is +10%, not +10x.
  acting-speed-bonus: 0.10

  # Duration of buff (in hours), used as a fallback the same way as acting-speed-bonus above.
  buff-duration-hours: 24

  # Resources in the reward pool for each incursion event = sum of the reward for every zone's
  # tier that was active in the event. The pool is then split proportionally across every town
  # that cleared "contribution.min-score-share" below — see RewardDistributor.
  # Example: an event with 1 GREEN + 1 RED + 1 DEATH zone gives green + red + death rewards.
  winner-resources:
    green:
      gold: 10.0
      silver: 20.0
      gems: 5.0
    yellow:
      gold: 25.0
      silver: 50.0
      gems: 12.0
    red:
      gold: 50.0
      silver: 100.0
      gems: 25.0
    death:
      gold: 100.0
      silver: 200.0
      gems: 50.0

  # Contribution scoring — determines each town's rank and resource share.
  # score(town) = sum over beacons of:
  #   (holdSeconds * hold-weight + contestedSeconds * contested-hold-weight
  #    + captures * capture-weight) * tier-weights[beacon's zone tier]
  # Headcount-neutral by construction: a beacon ticks the same whether 1 or 20 players hold it.
  contribution:
    hold-weight: 1.0
    contested-hold-weight: 2.0   # defending under pressure outweighs uncontested camping
    capture-weight: 30.0
    tier-weights:
      green: 1.0
      yellow: 1.25
      red: 1.5
      death: 2.0
    # A town scoring below this fraction of the top town's score gets no reward at all.
    min-score-share: 0.05

  # Podium: the Acting Speed buff is scarce and rank-tiered, not proportional — this is what
  # makes the event a contest you can lose. Ranks not listed here get resources only, no buff.
  # acting-speed is a delta (0.10 = +10%), same convention as acting-speed-bonus above.
  podium:
    rank-1:
      acting-speed: 0.10
      duration-hours: 24
    rank-2:
      acting-speed: 0.05
      duration-hours: 12

  # Nation amplification (requires the Lands plugin — HuskTowns has no nation concept).
  # Multiplies the RESOURCE share only (never the buff) of towns that qualified for a reward,
  # scaled by how many of that town's Nation allies also qualified this event. A nation-mate that
  # didn't show up and contribute gets nothing — this only rewards nations that coordinate.
  nation:
    enabled: true
    bonus-per-extra-town: 0.10   # +10% per additional qualifying town from the same nation
    max-multiplier: 1.30

  # MVP: top individual contributors get a personal reward regardless of whether their town
  # placed on the podium — makes showing up worthwhile even for small or solo-ish towns.
  mvp:
    count: 3
    acting-effort: 10.0
    command: ""   # optional console command, placeholder: %player%

  # Holder streak: rank 1 is publicly the "Holder" until dethroned. Consecutive wins escalate
  # their buff (capped), and dethroning a holder with a streak of 2+ pays extra resources.
  holder:
    streak-bonus-per-win: 0.02       # added to the rank-1 delta per consecutive win: 0.10 -> 0.12 -> 0.14 ...
    max-streak-bonus: 0.06
    dethrone-resource-multiplier: 1.25

permanent-zones:
  # Number of Points of Interest active simultaneously per zone
  poi-count: 3
  # How long each PoI stays active before rotating (seconds)
  poi-duration-seconds: 300
  # Number of extraction points active simultaneously per zone
  extraction-point-count: 2
  # How long each extraction point stays active (seconds)
  extraction-point-duration-seconds: 180
  # Radius (blocks) within which a player accumulates resources from a PoI
  poi-capture-radius: 8.0
  # Radius (blocks) within which a player can begin an extraction channel
  extraction-radius: 6.0
  # How long (seconds) a player must stand at an extraction point to extract resources
  extraction-channel-seconds: 10
  # How many blocks outside the zone boundary the player is teleported after successful extraction
  extraction-exit-buffer: 15.0
  # Enable particle effects for zone boundaries, PoIs, and extraction points
  particles-enabled: true
  # How far away (blocks) players can see permanent zone particles
  particle-view-distance: 64.0
  # Minimum seconds before a depleted/expired PoI respawns (random delay in this range)
  poi-respawn-min-seconds: 120
  # Maximum seconds before a depleted/expired PoI respawns
  poi-respawn-max-seconds: 300

  # Base extraction rate from a PoI
  # Example: 1.0 amount per 10 seconds (ticks every second, so 0.1/s)
  poi-base-amount: 1.0
  poi-base-interval: 10

  # Bonus extraction rate for staying at the PoI
  # For every bonus-interval (seconds) a player stays, the amount extracted per base-interval
  # increases by bonus-amount.
  # Example: base 1.0/10s, bonus 0.5 every 30s.
  # At 0s-29s: 1.0/10s. At 30s-59s: 1.5/10s. At 60s+: 2.0/10s.
  poi-bonus-amount: 0.5
  poi-bonus-interval: 30

  # Custom icons shown on the map for each PoI resource type.
  # Set to a file path relative to the CosmosIncursion plugin data folder
  # (e.g., "icons/gold_ingot.png"). Leave empty to use the default colored circle.
  # Icons must be PNG files. Recommended size: 32x32 pixels.
  poi-icons:
    gold: ""
    silver: ""
    gems: ""
    # Display size of icons on the map in pixels
    size: 32

  # Per-tier configuration for permanent extraction zones.
  #
  # drop-chance    — probability each inventory item slot drops on death inside the zone
  #                  (0.0 = nothing, 1.0 = full drop). Resource buffer is always lost on death.
  #
  # daily-budget   — total units of each resource this zone tier can produce per 24-hour period.
  #                  Once the budget for a resource is exhausted, no more PoIs of that type
  #                  spawn until the next day resets. Set these to control how much players
  #                  can earn from this zone each day.
  #
  # poi-cap        — maximum units a single PoI can hold for each resource type.
  #                  Extraction rate is defined by poi-base-amount/interval above.
  #                  Multiple players at once will drain the PoI faster.
  #                  Example: daily-budget gems = 20, poi-cap gems = 5 -> up to 4 gems PoIs per day.
  #
  # extraction-acting-effort - CircleOfImagination effort (WORLD_CONTENT source) granted
  #                            to a player for each successful resource extraction from a zone of this tier.
  #
  # pvp-acting-effort - CircleOfImagination effort (PLAYER_INTERACTION source) granted to
  #                     the killer for a qualifying PvP kill in a zone of this tier.
  tiers:
    safe:
      drop-chance: 0.0
      daily-budget:
        gold: 30.0
        silver: 60.0
        gems: 15.0
      poi-cap:
        gold: 3.0
        silver: 6.0
        gems: 1.5
      extraction-acting-effort: 0.5
      pvp-acting-effort: 0.0
    medium:
      drop-chance: 0.33
      daily-budget:
        gold: 60.0
        silver: 150.0
        gems: 30.0
      poi-cap:
        gold: 6.0
        silver: 15.0
        gems: 3.0
      extraction-acting-effort: 1.0
      pvp-acting-effort: 1.0
    hard:
      drop-chance: 1.0
      daily-budget:
        gold: 120.0
        silver: 300.0
        gems: 60.0
      poi-cap:
        gold: 12.0
        silver: 30.0
        gems: 6.0
      extraction-acting-effort: 2.0
      pvp-acting-effort: 2.0

discord:
  # Master switch for Discord webhook notifications when an incursion event starts (countdown begins).
  # Each entry below also has its own "enabled" flag, so you can toggle individual webhooks.
  enabled: false

  # One or more webhooks to notify. Add an entry per channel/language (e.g. English + Ukrainian).
  # - name           — label for logs only, does not appear in Discord
  # - enabled        — toggle this specific webhook on/off
  # - webhook-url    — Discord webhook URL (Server Settings > Integrations > Webhooks)
  # - ping-role-id   — role to @-ping in this webhook's message. Leave blank for no ping.
  #                    Enable Developer Mode in Discord, right-click a role, "Copy Role ID".
  # - title          — "starting" embed title. Supports %countdown% and %zones% placeholders.
  # - description    — "starting" embed description. Supports %countdown% and %zones% placeholders.
  # - results-title  — title used for the end-of-event results embed. The description for that
  #                    embed is always built from the actual standings, so it isn't templated.
  # - image-url      — optional image shown in the embed. Leave blank for no image.
  # - color          — embed color, 6-digit hex RGB string (no '#').
  webhooks:
    - name: "english"
      enabled: true
      webhook-url: ""
      ping-role-id: ""
      title: "⚠️ Incursion Event Starting!"
      description: "An incursion begins in %countdown% seconds! %zones% zones will be active."
      results-title: "🏆 Incursion Results"
      image-url: ""
      color: "FF0000"

    - name: "ukrainian"
      enabled: false
      webhook-url: ""
      ping-role-id: ""
      title: "⚠️ Вторгнення починається!"
      description: "Вторгнення почнеться через %countdown% секунд! Буде активно %zones% зон(и)."
      results-title: "🏆 Результати вторгнення"
      image-url: ""
      color: "FF0000"

messages:
  event-starting: "<red>[Cosmos Incursion]</red> <white>An incursion begins in %countdown% seconds!</white>"
  event-started: "<red>[Cosmos Incursion]</red> <white>The incursion has begun! %zones% zones active.</white>"
  event-time-remaining: "<red>[Cosmos Incursion]</red> <yellow>%minutes% minutes remaining!</yellow> <gray>Contest the beacons while you can!</gray>"
  event-ending: "<red>[Cosmos Incursion]</red> <white>The incursion is ending...</white>"
  event-ended: "<red>[Cosmos Incursion]</red> <white>The incursion has concluded.</white>"
  zone-entry: "<red>The barrier of reality dissolves...</red>"
  zone-exit: "<green>You have left the incursion zone.</green>"
  corrupted-monster: "<dark_red>%player% has become a Corrupted Monster!</dark_red>"
  death-regression: "<red>Your sequence has regressed due to death in the incursion.</red>"
  paper-angel-saved: "<green>Your Paper Angel has protected you from regression!</green>"
